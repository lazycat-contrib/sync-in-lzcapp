application:
  subdomain: sync-in
  multi_instance: false
  # Sync-in has a self-service first-run account creation path:
  # INIT_ADMIN creates the first admin on startup (official entry script),
  # and users can also self-register if enabled by the admin. The web UI
  # is a full account system behind its own login, so public_path is used
  # (papra/servas/coral precedent, 2026-11).
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://sync-in:8080/

services:
  sync-in:
    # upstream: syncin/server:2.6.2
    image: docker.1ms.run/syncin/server:2.6.2
    environment:
      - SYNCIN_SERVER_PORT=8080
      - SYNCIN_MYSQL_URL=mysql://root:{{PASSWORD_si_db}}@mariadb:3306/sync_in
      - SYNCIN_AUTH_TOKEN_ACCESS_SECRET={{PASSWORD_si_tok_access}}
      - SYNCIN_AUTH_TOKEN_REFRESH_SECRET={{PASSWORD_si_tok_refresh}}
      - SYNCIN_AUTH_ENCRYPTION_KEY={{PASSWORD_si_mfa_key}}
      - INIT_ADMIN
      - INIT_ADMIN_LOGIN=admin
      - INIT_ADMIN_PASSWORD={{PASSWORD_si_admin}}
      - TZ=Asia/Shanghai
    depends_on:
      - mariadb
    binds:
      - /lzcapp/var/mutdata/data:/app/data
  mariadb:
    image: docker.1ms.run/library/mariadb:11.8.3
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
    environment:
      - MYSQL_ROOT_PASSWORD={{PASSWORD_si_db}}
      - MYSQL_DATABASE=sync_in
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/mutdata/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
usage: |
  Sync-in 是一个自主托管的文件存储、共享、同步与协作平台（AGPL-3.0），
  支持空间与权限管理、分享链接、WebDAV、桌面客户端同步与在线协作，
  数据全部保存在本机（/lzcapp/var/mutdata）。

  使用方法：
  1. 首次启动会自动创建管理员账号 admin，登录密码为部署时显示的随机密码。
  2. 登录后建议立即在账户设置中修改密码；可在管理后台开启用户自助注册。
  3. 文件存储在 /lzcapp/var/mutdata，卸载应用会一并删除。

  说明：
  - 应用自带完整账号与登录体系，因此本包使用 public_path 直接开放，
    由应用自身的登录鉴权（papra/servas 判例）。
  - 本包未做实机验证，功能以官方文档为准：https://sync-in.io/
  - 许可证 AGPL-3.0 随包分发，见 /package-licenses/。
